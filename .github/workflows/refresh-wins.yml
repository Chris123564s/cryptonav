name: Refresh Success Cases (DexScreener)

on:
  schedule:
    # 每天 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch top Solana gainers from DexScreener
        env:
          USE_PROXY: '0'
          CI: 'true'
        run: python scripts/fetch_dex_wins.py

      # 安全网：即便上面的采集中途失败，也保证 dex logo 目录不残留孤儿文件。
      # 2026-08-31 就是因为这个目录攒到 45 MB、dist 涨到 67 MB，
      # 导致 Cloudflare Pages 发布资源失败、整个站部署不上去。
      - name: Prune stale dex logos
        run: python scripts/prune-dex-logos.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wins.json public/data/wins.json public/logos/dex/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily refresh Success Cases (DexScreener top gainers, 6h)"
            git push
          fi
