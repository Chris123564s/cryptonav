name: Refresh Chain Tokens (Multi-API)

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch tokens from CoinGecko + CoinCap + DefiLlama
        env:
          USE_PROXY: '0'
          CI: 'true'
        run: python scripts/fetch_chain_tokens.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/chain-tokens.json public/logos/tokens/
          if git diff --cached --quiet; then
            echo "No changes — data is up to date"
          else
            git commit -m "chore: refresh chain tokens (prices, logos, market data, TVL)"
            git push
          fi
