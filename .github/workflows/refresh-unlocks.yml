name: Refresh Token Unlocks (maintenance)

on:
  schedule:
    # 每天 03:00 UTC 维护一次（排序 + 清理过期事件）
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Maintain token unlocks (sort + prune stale)
        # Keyless: no API, no secrets. Lower PRUNE_PAST_DAYS to declutter
        # sooner (e.g. 90 keeps only events from the last ~3 months).
        env:
          PRUNE_PAST_DAYS: '365'
        run: python scripts/fetch_unlocks.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/unlocks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: maintain token unlocks (sort + prune stale, daily)"
            git push
          fi
