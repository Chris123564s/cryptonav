name: Refresh Token Unlocks (Tokenomist)

on:
  schedule:
    # 每天 03:00 UTC 刷新一次（避开其他采集任务的高峰）
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch latest token unlocks from Tokenomist
        env:
          USE_PROXY: '0'
          CI: 'true'
          # Optional: add a repo secret TOKENOMIST_API_KEY (free tier at
          # tokenomist.ai) to enable automatic refresh. Without it the script
          # safely preserves the curated unlocks.json (CI stays green).
          TOKENOMIST_API_KEY: ${{ secrets.TOKENOMIST_API_KEY }}
        run: python scripts/fetch_unlocks.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/unlocks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh token unlocks (Tokenomist API, daily)"
            git push
          fi
