name: Deploy to Cloudflare Pages (Wrangler)

# This workflow exists because Cloudflare Pages' own Git-integrated builder
# started failing on 2026-08-31 with a contentless error:
#
#     Failed: an internal error occurred. If this continues, contact support
#     Error: Failed to publish assets.
#
# It fires ~1.5s after "Deploying your site to Cloudflare's global network...",
# survives a 61 MB -> 21 MB reduction in output size, and fires on docs-only
# commits that produce a byte-identical `dist`. That is a time-correlated
# failure, not a content-correlated one -- see cloudflare/workers-sdk#13259 for
# the same shape of report.
#
# Publishing with Wrangler instead does two useful things:
#   1. it bypasses the Pages Git builder entirely, and
#   2. it surfaces a real error instead of "an internal error occurred".
#
# Trigger is manual on purpose: while the Pages Git integration is still
# enabled, an automatic trigger would build and publish every push twice.
# Once this is proven, add `push: branches: [main]` and disable the Pages Git
# integration in the Cloudflare dashboard to stop the duplicate builds.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Deployment branch. "main" = production, anything else = preview.'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: wrangler-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cryptonav' }}
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'main' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Verify secrets are present
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "secrets ok; project=$CLOUDFLARE_PAGES_PROJECT branch=$DEPLOY_BRANCH"

      # Checkout MUST come before the two verification steps below: both run
      # scripts out of the repository, so on a runner that has not checked out
      # yet they fail with "can't open file" and no useful annotation. (This
      # bit us once -- the only symptom was a bare
      # "Process completed with exit code 1" with no error text.)
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Ask Cloudflare whether the token is live before spending an npm ci, a
      # build and three deploy attempts on it. A wrong scope, a read-only grant
      # or a typo'd value all look identical downstream: wrangler just fails,
      # three times, without saying why. This names the problem instead.
      #
      # Keep the logic in scripts/verify-cloudflare-token.mjs rather than inline:
      # it needs real branching (read vs write grants, account scope, expiry),
      # and inline `node -e` inside YAML is impossible to test and easy to break
      # with shell expansion.
      - name: Verify the API token with Cloudflare
        run: |
          # Guard against the failure mode that cost a whole CI run once: if the
          # script is not there, `node` dies with "can't open file" on stderr,
          # which produces no annotation at all -- just a bare
          # "Process completed with exit code 1". Say what is wrong instead.
          if [ ! -f scripts/verify-cloudflare-token.mjs ]; then
            echo "::error::scripts/verify-cloudflare-token.mjs not found -- checkout did not produce it"
            exit 1
          fi
          node scripts/verify-cloudflare-token.mjs

      # `wrangler pages deploy` with an unknown --project-name does not error:
      # it silently creates a brand new Pages project. That project has no
      # custom domain attached, so the deploy would "succeed" while
      # cryptonav.site kept serving the old build -- the exact failure we are
      # trying to fix, but harder to notice. Verify the name exists first.
      #
      # A failure of this *check* is non-fatal (the token may simply lack read
      # scope) -- it warns and lets the deploy through. A definitive "not
      # present" result is fatal.
      - name: Verify the Pages project name is correct
        run: |
          resp=$(curl -sS -w '\n%{http_code}' \
                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 -H "Content-Type: application/json" \
                 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" || true)
          body=$(printf '%s' "$resp" | sed '$d')
          code=$(printf '%s' "$resp" | tail -n1)
          echo "projects API HTTP $code"

          # This call is also the authoritative permission test. It beats
          # inspecting permission-group names, which are not stable across API
          # versions: a 200 proves Pages access whatever the grant is called,
          # and a 401/403 proves there is none.
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::the Pages API rejected this token (HTTP $code)."
            echo "::error::it cannot list projects, so it certainly cannot deploy."
            echo "::error::re-create CLOUDFLARE_API_TOKEN with Account -> Cloudflare Pages"
            echo "::error::-> Edit. Cloudflare Pages is an ACCOUNT-level permission; a"
            echo "::error::token built from Zone-level permissions will be rejected here."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::could not list Pages projects (HTTP $code) -- skipping the name check"
            echo "::warning::if the name is wrong, the deploy will CREATE a new project with no custom domain"
            exit 0
          fi
          echo "Pages API accepted this token -- it has at least read access to Pages"
          printf '%s' "$body" | node -e '
            let s = "";
            process.stdin.on("data", d => (s += d)).on("end", () => {
              const want = process.env.CLOUDFLARE_PAGES_PROJECT;
              let j;
              try { j = JSON.parse(s); } catch { console.log("::warning::unparseable response -- skipping name check"); return; }
              if (!j.success) { console.log("::warning::API said success=false -- skipping name check"); return; }
              const names = (j.result || []).map(p => p.name);
              console.log("existing Pages projects: " + (names.join(", ") || "(none)"));
              if (!names.includes(want)) {
                console.log(`::error::no Pages project named "${want}".`);
                console.log("::error::refusing to deploy -- wrangler would create a new project with no custom domain.");
                console.log("::error::set the repository variable CLOUDFLARE_PAGES_PROJECT to one of the names above.");
                process.exit(1);
              }
              console.log(`project "${want}" exists -- good`);
            });
          '

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check output integrity before publishing
        run: |
          node scripts/check-dist-size.mjs
          # Catches the class of problem Cloudflare reports as a bare
          # "Failed to publish assets": invalid UTF-8, NUL bytes, empty files,
          # non-ASCII paths, case collisions. An empty .gitkeep is tolerated.
          node scripts/scan-dist-integrity.mjs dist \
            || echo "::warning::dist integrity scan reported problems (see log)"
          # Validated against Wrangler's real rules rather than the docs, which
          # disagree: the docs call `exclude` optional, the code requires it.
          # An invalid _routes.json fails every publish, so this is a hard
          # failure -- no point spending three deploy attempts on it.
          node scripts/check-routes-json.mjs

      - name: Install wrangler once
        id: wrangler
        run: |
          # Installed ahead of the publish loop so that a slow npm download
          # cannot be mistaken for a deploy failure, and so the version that
          # ran is recorded in the log.
          npm install --no-save wrangler@4
          npx wrangler --version

      - name: Publish (3 attempts)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::wrangler deploy attempt $attempt"
            # Tee to a file: on failure we reprint the output outside the
            # collapsible group, so the real wrangler error is visible without
            # expanding anything by hand.
            #
            # The last attempt runs with WRANGLER_LOG=debug. Normal output says
            # only "Failed to publish assets"; debug adds the HTTP status and
            # response body of each Cloudflare API call, which is what actually
            # distinguishes an auth problem from a platform-side outage.
            if [ "$attempt" -eq 3 ]; then
              export WRANGLER_LOG=debug
            fi
            if npx wrangler pages deploy dist \
                --project-name="$CLOUDFLARE_PAGES_PROJECT" \
                --branch="$DEPLOY_BRANCH" \
                --commit-dirty=true 2>&1 | tee "deploy-attempt-$attempt.log"; then
              echo "::endgroup::"
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 25
            fi
          done

          echo "::error::all 3 publish attempts failed"
          echo ""
          # Attempt 1 is the short, readable error. Print it whole.
          echo "=========== WRANGLER OUTPUT (attempt 1, full) ==========="
          cat deploy-attempt-1.log 2>/dev/null || echo "(no attempt 1 log)"
          echo "=========== END WRANGLER OUTPUT ==========="
          echo ""
          # Attempt 3 is verbose debug output, so print only its tail; the
          # complete log is uploaded as an artifact below.
          echo "=========== WRANGLER DEBUG (attempt 3, last 150 lines) ==========="
          tail -n 150 deploy-attempt-3.log 2>/dev/null || echo "(no attempt 3 log)"
          echo "=========== END WRANGLER DEBUG ==========="
          echo ""
          echo "How to read the above:"
          echo "  - 401/403, 'Authentication error', 'Insufficient permissions'"
          echo "      -> the API token. Re-create it with 'Edit Cloudflare Pages'."
          echo "  - 'Couldn't find account' / 'account not found'"
          echo "      -> CLOUDFLARE_ACCOUNT_ID is wrong for this token."
          echo "  - the same 'Failed to publish assets' / 'internal error' as the"
          echo "    Pages dashboard, with 200s on the upload calls"
          echo "      -> Pages CI is not the culprit either; the publish pipeline"
          echo "         itself is failing. Escalate to Cloudflare support with the"
          echo "         deployment IDs -- a ready-made ticket is in"
          echo "         CryptoNav-待办操作手册.md."
          exit 1

      # GitHub's Annotations panel only shows ::error:: / ::warning:: lines.
      # Wrangler's output is plain stdout and never appears there, which is why
      # every failed run so far looked contentless until someone expanded a
      # collapsed log group by hand. Lift the decisive lines into annotations.
      #
      # The one thing that matters is the HTTP status Cloudflare returned:
      # 401/403 means the token still lacks write access; 200s everywhere means
      # the publish pipeline itself is broken and this is a support ticket.
      - name: Surface the wrangler failure as annotations
        if: failure()
        run: |
          # Turn CRs into newlines first (progress bars would otherwise collapse
          # into one unreadable line), then escape % -- a raw % or CR inside an
          # annotation is parsed as an escape sequence and corrupts the message.
          annotate() {
            tr '\r' '\n' \
              | sed -e 's/%/%25/g' \
              | grep -v '^[[:space:]]*$' \
              | head -n "${1:-25}" \
              | while IFS= read -r line; do echo "::error::$line"; done
          }

          if [ -s deploy-attempt-1.log ]; then
            echo "::error::----- wrangler error (attempt 1, tail) -----"
            tail -n 25 deploy-attempt-1.log | annotate 25
          else
            echo "::error::no attempt 1 log was produced -- the publish step never ran"
          fi

          if [ -s deploy-attempt-3.log ]; then
            # Debug log: look for HTTP statuses and auth/permission signals.
            status_lines=$(grep -inE '\b(401|403|404|429|500|502|503)\b|unauthorized|forbidden|denied|insufficient|not allowed|permission|authentication' \
              deploy-attempt-3.log | head -n 15)
            if [ -n "$status_lines" ]; then
              echo "::error::----- HTTP / auth signals in attempt 3 (debug) -----"
              printf '%s\n' "$status_lines" | annotate 15
            else
              echo "::error::attempt 3 (debug) shows NO 4xx/5xx and no permission errors"
              echo "::error::-> the token was accepted and the uploads returned success,"
              echo "::error::-> yet the publish still failed. That points at Cloudflare's"
              echo "::error::-> publish pipeline, not at anything in this repository."
            fi
          fi

      - name: Upload deploy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-log
          path: deploy-attempt-*.log
          if-no-files-found: ignore
