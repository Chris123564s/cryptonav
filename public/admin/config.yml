# Decap CMS 配置
# 管理后台地址: https://cryptonav.site/admin

backend:
  name: github
  repo: Chris123564s/cryptonav
  branch: main
  site_domain: https://cryptonav.site
  base_url: https://cryptonav.site
  auth_endpoint: /api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    files:
      - file: "src/data/projects.json"
        name: "projects"
        label: "All Projects"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Project List"
            name: "projects"
            widget: "list"
            required: true
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "e.g. binance" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Category", name: "category", widget: "select", options: ["exchange-cex", "exchange-dex", "exchange-derivatives", "exchange-p2p", "wallet-hot", "wallet-cold", "wallet-multisig", "market-aggregator", "market-analytics", "market-explorer", "defi-lending", "defi-yield", "defi-bridge", "defi-stablecoin", "nft-marketplace", "nft-tools", "infra-chain", "infra-layer2", "infra-dev-tools", "security-audit", "security-tools", "media-news", "media-community", "media-education", "tools-portfolio", "tools-tax", "tools-airdrop", "at-onchain", "at-copytrade", "at-sniper"] }
              - { label: "Tags", name: "tags", widget: "list", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Website", name: "website", widget: "string" }
              - { label: "Referral / Affiliate URL", name: "referral", widget: "string", required: false, hint: "If set, project links will use this URL instead of website (for affiliate revenue)" }
              - { label: "Social", name: "social", widget: "object", required: false, collapsed: true, fields: [
                  { label: "Twitter", name: "twitter", widget: "string", required: false },
                  { label: "Telegram", name: "telegram", widget: "string", required: false },
                  { label: "Discord", name: "discord", widget: "string", required: false },
                  { label: "GitHub", name: "github", widget: "string", required: false }
                ] }
              - { label: "Metrics", name: "metrics", widget: "object", required: false, collapsed: true, fields: [
                  { label: "Users", name: "users", widget: "string", required: false },
                  { label: "Volume", name: "volume", widget: "string", required: false },
                  { label: "TVL", name: "tvl", widget: "string", required: false }
                ] }
              - { label: "Verified", name: "verified", widget: "boolean", default: false }
              - { label: "Audited", name: "audited", widget: "boolean", default: false, required: false }
              - { label: "Risk Level", name: "riskLevel", widget: "select", options: ["low", "medium", "high"], default: "low", required: false }
              - { label: "Chains", name: "chains", widget: "select", options: ["ethereum", "solana", "bsc", "arbitrum", "base", "polygon", "avalanche", "optimism", "sui", "ton"], multiple: true, required: false, hint: "Which chains does this project operate on?" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Sponsored", name: "sponsored", widget: "boolean", default: false, required: false }
              - { label: "Sponsored Until", name: "sponsoredUntil", widget: "string", required: false }
              - { label: "Status", name: "status", widget: "select", options: ["active", "pending", "inactive"], default: "active" }
              - { label: "Source", name: "source", widget: "string", required: false }
              - { label: "Added At", name: "addedAt", widget: "string" }

  - name: "ads"
    label: "Ads"
    label_singular: "Ad"
    files:
      - file: "src/data/ads.json"
        name: "ads"
        label: "All Ads"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Ad List"
            name: "ads"
            widget: "list"
            required: true
            fields:
              - { label: "Ad ID", name: "id", widget: "string" }
              - { label: "Slot", name: "slot", widget: "select", options: ["home-banner", "sidebar-top", "sidebar-bottom", "footer-banner", "inline-card"] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Gradient", name: "gradient", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Weight", name: "weight", widget: "number", default: 1 }
              - { label: "Active", name: "active", widget: "boolean", default: true }
              - { label: "Start At", name: "startAt", widget: "string", required: false }
              - { label: "End At", name: "endAt", widget: "string", required: false }

  - name: "featured"
    label: "Featured"
    label_singular: "Feature"
    files:
      - file: "src/data/featured.json"
        name: "featured"
        label: "All Featured"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Featured List"
            name: "featured"
            widget: "list"
            required: true
            fields:
              - { label: "Project ID", name: "projectId", widget: "string" }
              - { label: "Reason", name: "reason", widget: "string" }
              - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "ticker"
    label: "Ticker"
    label_singular: "Coin"
    files:
      - file: "src/data/ticker.json"
        name: "ticker"
        label: "All Ticker"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Coin List"
            name: "ticker"
            widget: "list"
            required: true
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Symbol", name: "symbol", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "image", widget: "image", required: false }
              - { label: "Current Price", name: "currentPrice", widget: "number", default: 0 }
              - { label: "24h Change %", name: "priceChangePercentage24h", widget: "number", default: 0 }

  - name: "recommended"
    label: "Recommended"
    label_singular: "Token"
    files:
      - file: "src/data/recommended.json"
        name: "recommended"
        label: "All Recommended"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Recommended List"
            name: "recommended"
            widget: "list"
            required: true
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Symbol", name: "symbol", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Reason", name: "reason", widget: "text" }
              - { label: "Entry Price", name: "entryPrice", widget: "number", default: 0 }
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Sponsored", name: "sponsored", widget: "boolean", default: false }
              - { label: "Badge Text", name: "badge", widget: "string", required: false }

  - name: "wins"
    label: "Success Cases"
    label_singular: "Case"
    files:
      - file: "src/data/wins.json"
        name: "wins"
        label: "All Cases"
        extension: "json"
        format: "json"
        create: true
        delete: true
        editor:
          preview: false
        fields:
          - label: "Case List"
            name: "wins"
            widget: "list"
            required: true
            fields:
              - { label: "Symbol", name: "symbol", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Chain", name: "chain", widget: "string", default: "solana" }
              - { label: "6h Change %", name: "change6h", widget: "number", default: 0 }
              - { label: "Price USD", name: "price", widget: "number", default: 0 }
              - { label: "Date", name: "date", widget: "string" }
